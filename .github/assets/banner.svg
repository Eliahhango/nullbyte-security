<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="nullbyte-security">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a0f"/>
      <stop offset="0.55" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#94a3b8" stroke-opacity="0.06"/>
    </pattern>
    <style>
      @keyframes pulse {
        0%, 100% { opacity: .18; transform: scale(1); }
        50% { opacity: .34; transform: scale(1.08); }
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes slide {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .orb { animation: pulse 6s ease-in-out infinite; transform-origin: center; }
      .cursor { animation: blink 1.1s step-end infinite; }
      .fade { opacity: 1; animation: slide .8s ease-out both; }
      .d1 { animation-delay: .15s; }
      .d2 { animation-delay: .35s; }
      .d3 { animation-delay: .55s; }
      .d4 { animation-delay: .75s; }
      @media (prefers-reduced-motion: reduce) {
        .orb, .cursor, .fade { animation: none; opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <circle class="orb" cx="1020" cy="70" r="170" fill="#22d3ee" opacity=".2"/>
  <circle class="orb" cx="1120" cy="280" r="150" fill="#4ade80" opacity=".16" style="animation-delay:2s"/>

  <g class="fade d1">
    <text x="72" y="118" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="62" font-weight="700">nullbyte-security</text>
  </g>

  <g class="fade d2">
    <text x="76" y="162" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" letter-spacing=".5">Agentic pentesting for the NullByte CLI</text>
  </g>

  <g class="fade d3">
    <rect x="72" y="198" width="700" height="58" rx="12" fill="#0b1220" stroke="#1e293b"/>
    <circle cx="96" cy="227" r="5" fill="#ef4444"/>
    <circle cx="114" cy="227" r="5" fill="#f59e0b"/>
    <circle cx="132" cy="227" r="5" fill="#22c55e"/>
    <text x="154" y="233" fill="#4ade80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">$</text>
    <text x="174" y="233" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">nullbyte run "recon app.acme.test"</text>
  </g>

  <g class="fade d4">
    <text x="76" y="300" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">scope enforcement · recon · ports · scanners · sast · evidence · findings · reports</text>
  </g>
</svg>
