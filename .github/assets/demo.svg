<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-label="Animated NullByte security session">
  <defs>
    <linearGradient id="term" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080d13"/>
      <stop offset="1" stop-color="#05070a"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity="0.2"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes show {
        from { opacity: 0; transform: translateY(5px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .l { opacity: 1; animation: show .4s ease-out both; }
      .cursor { animation: blink 1s step-end infinite; }
      @media (prefers-reduced-motion: reduce) {
        .l, .cursor { animation: none; opacity: 1; }
      }
      text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 16px;
      }
    </style>
  </defs>

  <rect x="1" y="1" width="998" height="458" rx="14" fill="url(#term)" stroke="#1f3b2a"/>
  <rect x="1" y="1" width="998" height="46" rx="14" fill="#0b1220"/>
  <rect x="1" y="30" width="998" height="17" fill="#0b1220"/>
  <circle cx="28" cy="24" r="6" fill="#ff2d55"/>
  <circle cx="50" cy="24" r="6" fill="#f59e0b"/>
  <circle cx="72" cy="24" r="6" fill="#22c55e"/>
  <text x="500" y="30" text-anchor="middle" fill="#64748b" font-size="13">operator@nullbyte: ~/acme</text>
  <text x="974" y="30" text-anchor="end" fill="#ff2d55" font-size="12" letter-spacing="1">AUTHORIZED</text>
  <rect x="1" y="47" width="998" height="412" fill="url(#scan)" opacity=".55"/>

  <g transform="translate(34 96)">
    <g class="l" style="animation-delay:.2s">
      <text x="0" y="0" fill="#4ade80" filter="url(#glow)">$</text>
      <text x="20" y="0" fill="#e5e7eb">nullbyte run "recon app.acme.test"</text>
    </g>

    <g class="l" style="animation-delay:.8s">
      <text x="0" y="36" fill="#22d3ee">[+]</text>
      <text x="40" y="36" fill="#9ca3af">scope check ....</text>
      <text x="220" y="36" fill="#4ade80">allowed</text>
      <text x="300" y="36" fill="#475569">(authorized_all)</text>
    </g>

    <g class="l" style="animation-delay:1.15s">
      <text x="0" y="72" fill="#22d3ee">[+]</text>
      <text x="40" y="72" fill="#9ca3af">dns ............</text>
      <text x="220" y="72" fill="#e5e7eb">app.acme.test → 203.0.113.10</text>
    </g>

    <g class="l" style="animation-delay:1.5s">
      <text x="0" y="108" fill="#22d3ee">[+]</text>
      <text x="40" y="108" fill="#9ca3af">http ...........</text>
      <text x="220" y="108" fill="#4ade80">200 OK</text>
      <text x="292" y="108" fill="#475569">·</text>
      <text x="308" y="108" fill="#e5e7eb">nginx · Acme Portal</text>
    </g>

    <g class="l" style="animation-delay:1.85s">
      <text x="0" y="144" fill="#22d3ee">[+]</text>
      <text x="40" y="144" fill="#9ca3af">tls ............</text>
      <text x="220" y="144" fill="#e5e7eb">TLS 1.3 · expires in 41 days</text>
    </g>

    <g class="l" style="animation-delay:2.2s">
      <text x="0" y="180" fill="#f59e0b">[!]</text>
      <text x="40" y="180" fill="#9ca3af">finding ........</text>
      <text x="220" y="180" fill="#fbbf24">missing HSTS</text>
      <text x="350" y="180" fill="#475569">· medium · CVSS 5.3</text>
    </g>

    <g class="l" style="animation-delay:2.55s">
      <text x="0" y="216" fill="#22d3ee">[+]</text>
      <text x="40" y="216" fill="#9ca3af">evidence .......</text>
      <text x="220" y="216" fill="#60a5fa">sha256:9f2c… archived</text>
    </g>

    <g class="l" style="animation-delay:2.9s">
      <text x="0" y="252" fill="#22d3ee">[+]</text>
      <text x="40" y="252" fill="#9ca3af">report .........</text>
      <text x="220" y="252" fill="#c084fc">app.acme.test/reports/report.md</text>
    </g>

    <g class="l" style="animation-delay:3.25s">
      <text x="0" y="288" fill="#4ade80">[+]</text>
      <text x="40" y="288" fill="#9ca3af">session ........</text>
      <text x="220" y="288" fill="#e5e7eb">2 findings · evidence hash verified</text>
    </g>

    <g class="l" style="animation-delay:3.6s">
      <text x="0" y="340" fill="#4ade80" filter="url(#glow)">$</text>
      <rect class="cursor" x="18" y="326" width="10" height="18" fill="#4ade80"/>
    </g>
  </g>
</svg>
